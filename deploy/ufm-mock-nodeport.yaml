---
# Publishes the mock on the node so the kind extraPortMapping can reach it.
# Pairs with deploy/kind-cluster.yaml: nodePort 30888 -> host port 9888.
apiVersion: v1
kind: Service
metadata:
  name: ufm-mock-nodeport
  namespace: ufm-demo
  labels:
    app: ufm-mock
spec:
  type: NodePort
  selector:
    app: ufm-mock
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30888
